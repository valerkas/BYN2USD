name: Production smoke

on:
  schedule:
    # Every Monday 09:00 UTC (~12:00 Minsk)
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests (offline fixtures)
        run: npm run test:unit

      - name: Production tests (live sites with the packaged extension)
        run: npm run test:production

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "BYN2USD production smoke FAILED"
          to: valerkas@gmail.com
          from: BYN2USD Alerts <valerkas@gmail.com>
          body: |
            Weekly BYN2USD tests failed.

            Repo: ${{ github.repository }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The "test-results" artifact contains report.json, traces, screenshots
            and markup-diagnostics.json (current price CSS classes) for each failed test.
