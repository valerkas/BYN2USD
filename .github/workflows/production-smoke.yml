name: Production smoke

on:
  schedule:
    # Every Monday 09:00 UTC (~12:00 Minsk)
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke
        id: smoke
        run: npm run test:production

      - name: Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "BYN2USD production smoke FAILED"
          to: valerkas@gmail.com
          from: BYN2USD Alerts <valerkas@gmail.com>
          body: |
            Weekly BYN2USD production smoke failed.

            Repo: ${{ github.repository }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Branch: ${{ github.ref_name }}

            Open the Actions log for the per-case report (TC-NBRB, TC-AV-*, TC-KF-*).
