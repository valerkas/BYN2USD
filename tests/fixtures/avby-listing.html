<!doctype html>
<!-- Snapshot of cars.av.by listing markup (price-primary blocks). -->
<html lang="ru">
<head><meta charset="utf-8"><title>Объявления о продаже автомобилей</title></head>
<body>
  <div class="listing-top" data-test="top-1">
    <div class="listing-top__price-primary">67 615 руб.</div>
  </div>
  <div class="listing__items" data-test="items">
    <div class="listing-item" data-test="item-1">
      <a class="listing-item__link" href="https://cars.av.by/buick/encore-gx/1">Buick Encore GX</a>
      <div class="listing-item__params">
        <div>2023 г.</div>
        <div>1.3 л, бензин</div>
        <div>15 000 км</div>
      </div>
      <div class="listing-item__prices">
        <div class="listing-item__price-primary">66&nbsp;863&nbsp;руб.</div>
        <div class="listing-item__price-secondary">≈ 22 250 $</div>
      </div>
      <div class="listing-item__date">12 сент.</div>
    </div>
    <div class="listing-item" data-test="item-2">
      <a class="listing-item__link" href="https://cars.av.by/skoda/octavia/2">Skoda Octavia</a>
      <div class="listing-item__params"><div>2019 г.</div><div>120 000 км</div></div>
      <div class="listing-item__prices">
        <div class="listing-item__price-primary">56 796<span>&nbsp;</span>р.</div>
        <div class="listing-item__price-secondary">≈ 18 900 $</div>
      </div>
    </div>
  </div>
</body>
</html>
